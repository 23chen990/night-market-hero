name: Browser playable evidence
on:
  push:
    branches: [main, feat/playable-experience-20261012]
    paths: ['src/**', 'tests/playable-*.ts', 'index.html', 'scripts/**', '.github/workflows/visual-play.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record source and playable identity
        run: |
          mkdir -p evidence/playable-audit
          git rev-parse HEAD > evidence/playable-audit/commit.txt
          sha256sum dist/index.html > evidence/playable-audit/playable.sha256
      - run: npx playwright install --with-deps chromium
      - name: Real input journeys and settlement lifecycle
        run: npm run test:play
      - name: Natural failure and safe recovery
        if: ${{ !cancelled() }}
        run: node --import tsx tests/playable-safety-audit.ts
      - name: Narrow mobile menus and rotation guard
        if: ${{ !cancelled() }}
        run: node --import tsx tests/playable-menu-audit.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            evidence/playable-audit/
            dist/index.html
          retention-days: 30
