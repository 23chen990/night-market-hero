name: Refine and validate playable
on:
  push:
    branches: [feat/playable-experience-20261012]
    paths: [.github/workflows/refine-playable.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/playable-experience-20261012
      - name: Apply verified source refinement
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, base64, lzma
          patch = lzma.decompress(base64.b64decode(pathlib.Path('.chatgpt/refinement.txt').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b0b8929366764c07f4d1d20da64c4fda1e18a9b6a612db721bd7efd209f29de0'
          pathlib.Path('/tmp/refinement.patch').write_bytes(patch)
          PY
          git apply --check /tmp/refinement.patch
          git apply --index /tmp/refinement.patch
          git rm .chatgpt/refinement.txt .github/workflows/refine-playable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve visible rides across input handoff and verify complete touch journeys'
          git push origin HEAD:feat/playable-experience-20261012
          mkdir -p delivery
          git rev-parse HEAD > delivery/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build 2>&1 | tee delivery/build.log
      - name: Static and complete regression suite
        run: |
          npm run lint > delivery/lint.log 2>&1
          npm run typecheck > delivery/typecheck.log 2>&1
          node --import tsx --test tests/*.test.ts > delivery/tests.log 2>&1
          tail -n 15 delivery/tests.log
      - name: Install test browsers
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium webkit
      - name: Standalone file launch
        if: ${{ !cancelled() }}
        run: npm run test:file
      - name: Real input, map joins and lifecycle acceptance
        if: ${{ !cancelled() }}
        run: npm run test:play
      - name: Record exact tested source and deliverable
        if: ${{ !cancelled() }}
        run: |
          sha256sum dist/index.html > delivery/playable.sha256
          git ls-files src tests scripts docs dev index.html package.json package-lock.json vite.config.ts tsconfig.json eslint.config.js runtime-product-gates.json validate-runtime-product-gates.mjs README.md PROJECT_HANDOFF.md .gitignore | tar -czf delivery/runtime-source.tar.gz -T -
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: refined-playable
          path: |
            delivery/
            evidence/playable-audit/
            dist/index.html
          retention-days: 30
