name: Apply reviewed playable upgrade
on:
  push:
    branches: [feat/playable-experience-20261012]
    paths: [.github/workflows/apply-reviewed-patch.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/playable-experience-20261012
      - name: Verify and apply exact reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          payload = ''.join(pathlib.Path(f'.chatgpt/experience-{i}.txt').read_text().strip() for i in (1,2,3))
          patch = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ac86f8ff5ac2a7f27d70e33aaedfb4f0dc5f5fd61bc369a238eba44c2fe46e20'
          pathlib.Path('/tmp/reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/reviewed.patch
          git apply --index /tmp/reviewed.patch
          git rm .chatgpt/experience-1.txt .chatgpt/experience-2.txt .chatgpt/experience-3.txt .github/workflows/apply-reviewed-patch.yml .github/workflows/workspace-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: make early encounters playable, visible and rewarding; fix standalone delivery'
          git push origin HEAD:feat/playable-experience-20261012
          mkdir -p delivery
          git rev-parse HEAD > delivery/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build before artifact-dependent tests
        run: npm run build
      - name: Complete static and regression validation
        shell: bash
        run: |
          set +e
          npm run lint > delivery/lint.log 2>&1; lint=$?
          npm run typecheck > delivery/typecheck.log 2>&1; types=$?
          node --import tsx --test tests/*.test.ts > delivery/tests.log 2>&1; tests=$?
          printf '{"lint":%s,"typecheck":%s,"tests":%s}\n' "$lint" "$types" "$tests" > delivery/checks.json
          cat delivery/checks.json
          tail -n 15 delivery/tests.log
          grep -A 20 'not ok' delivery/tests.log || true
          cat delivery/lint.log delivery/typecheck.log
          test "$lint$types$tests" = '000'
      - name: Install browser engines
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium webkit
      - name: File URL smoke and real input journeys
        if: ${{ !cancelled() }}
        run: |
          node --import tsx tests/file-launch-smoke.ts
          node --import tsx tests/playable-browser-audit.ts
      - name: Capture exact deliverable
        if: ${{ !cancelled() }}
        run: |
          mkdir -p delivery
          sha256sum dist/index.html > delivery/playable.sha256
          git ls-files src tests scripts docs dev index.html package.json package-lock.json vite.config.ts tsconfig.json eslint.config.js runtime-product-gates.json validate-runtime-product-gates.mjs README.md PROJECT_HANDOFF.md .gitignore | tar -czf delivery/runtime-source.tar.gz -T -
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: upgraded-playable
          path: |
            delivery/
            evidence/playable-audit/
            dist/index.html
          retention-days: 7
