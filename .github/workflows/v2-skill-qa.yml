name: V2 Skill Encounters — Draft QA
on:
  pull_request:
    branches: [feat/playable-experience-20261012, feat/v2-skill-encounters-20261013]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'AGENTS.md'
      - 'PLAYABLE_START_HERE.md'
      - 'runtime-product-gates.json'
      - 'docs/V2_*'
      - '.github/workflows/v2-skill-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-skill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    name: Build and full unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: git rev-parse HEAD # archive and test the exact PR source SHA
      - name: Static and unit checks, do not lower contracts
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
          node --import tsx --test tests/*.test.ts
          sha256sum dist/index.html
      - name: Preserve exact source identity and playable HTML SHA
        if: success()
        run: |
          mkdir -p delivery/v2/portable
          git rev-parse HEAD > delivery/v2/portable/commit.txt
          sha256sum dist/index.html > delivery/v2/portable/build-manifest.sha256
      # The repository itself is already archived by its immutable Git SHA;
      # packaging the full asset history or node_modules produced 818+ MB
      # artifacts without improving audit validity.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-engineering-repro-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            delivery/v2/portable/
            dist/index.html
          retention-days: 14
          if-no-files-found: warn

  browser:
    name: Natural input and lifecycle (not a human approval)
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Offline single-file launch
        run: npm run test:file
      - name: Four real Chromium landscape coach safe-area checks
        run: npm run test:coach
      - name: Real phone and desktop journey with per-encounter evidence
        run: npm run test:play
      - name: Deliberate error in actual touch flight must result in guard contact
        run: npm run test:pursuit
      - name: Same-build independent escape-versus-caught verification
        run: npm run verify:chase-matrix
      - name: Failure, revive, viewport and menu checks
        run: npm run test:safety
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-natural-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/playable-audit/
            evidence/v2-pursuit/
            dist/index.html
          retention-days: 14
          if-no-files-found: warn

  player-choice:
    name: Same-build casual vs skilled natural input
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Ordinary player misses pulley and roof kite
        run: |
          mkdir -p delivery/v2
          V2_VIEWPORT=mobile V2_SKILLED_ROUTE=0 V2_DURATION_SECONDS=31 \
            V2_EVIDENCE_DIR=delivery/v2/casual node --import tsx tests/v2-natural-input-browser.ts \
            2>&1 | tee delivery/v2/casual-console.log
      - name: Skilled releases win both pulley and fixed high-roof kite
        run: |
          V2_VIEWPORT=mobile V2_SKILLED_ROUTE=1 V2_DURATION_SECONDS=31 \
            V2_EVIDENCE_DIR=delivery/v2/skilled node --import tsx tests/v2-natural-input-browser.ts \
            2>&1 | tee delivery/v2/skilled-console.log
      - name: Skilled low-route release and fresh press earn the fixed lantern knot
        run: |
          V2_VIEWPORT=mobile V2_SKILLED_ROUTE=1 V2_LANTERN_ROUTE=1 V2_DURATION_SECONDS=45 \
            V2_EVIDENCE_DIR=delivery/v2/lantern node --import tsx tests/v2-natural-input-browser.ts \
            2>&1 | tee delivery/v2/lantern-console.log
      - name: Advanced rooftop swing and real Qingluan grab (same HTML)
        run: |
          V2_VIEWPORT=mobile V2_SKILLED_ROUTE=1 V2_BIRD_ROUTE=1 V2_DURATION_SECONDS=58 \
            V2_EVIDENCE_DIR=delivery/v2/bird node --import tsx tests/v2-natural-input-browser.ts \
            2>&1 | tee delivery/v2/bird-console.log
      - name: Independent no-entitlement comparison
        run: |
          set -euo pipefail
          node tests/v2-compare-gate.mjs delivery/v2/casual/report.json \
            delivery/v2/skilled/report.json | tee delivery/v2/player-choice-result.json
          echo '### Optional ride is earned, not automatically gifted' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two real touch-input paths on the same exact build/viewport show an attributable missed pulley/kite versus skilled pulley and high-roof kite releases.' >> "$GITHUB_STEP_SUMMARY"
          echo '**This does not certify remaining rides, human playability, visual seams or native platforms.**' >> "$GITHUB_STEP_SUMMARY"
      - name: Independent real-press lantern check
        run: |
          set -euo pipefail
          node tests/v2-lantern-gate.mjs delivery/v2/skilled/report.json \
            delivery/v2/lantern/report.json | tee delivery/v2/lantern-result.json
      - name: Same-build real-input Qingluan missed versus earned
        run: |
          set -euo pipefail
          node tests/v2-bird-gate.mjs delivery/v2/lantern/report.json \
            delivery/v2/bird/report.json | tee delivery/v2/bird-result.json
          echo '### Qingluan: same visible world support, real two-release qualification, missed/earned and sustained mount' >> "$GITHUB_STEP_SUMMARY"
          echo '**Engineering browser evidence only; human and platform gates still blocked.**' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-choice-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path:
            delivery/v2/
          retention-days: 14
          if-no-files-found: warn
