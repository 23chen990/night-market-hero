name: V2 Skill Encounters — Draft QA
on:
  pull_request:
    branches: [feat/playable-experience-20261012]
    paths: ['src/**', 'tests/**', 'AGENTS.md', 'PLAYABLE_START_HERE.md',
      'runtime-product-gates.json', 'docs/V2_*', '.github/workflows/v2-skill-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-skill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    name: Build and full unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static and unit checks, do not lower contracts
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
          node --import tsx --test tests/*.test.ts
          sha256sum dist/index.html
  browser:
    name: Natural input and lifecycle (not a human approval)
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Offline single-file launch
        run: npm run test:file
      - name: Normal phone and desktop journey
        run: npm run test:play
      - name: Failure, revive, viewport and menu checks
        run: npm run test:safety
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-natural-evidence-${{ github.sha }}
          path: |
            evidence/playable-audit/
            dist/index.html
          retention-days: 14
          if-no-files-found: warn
