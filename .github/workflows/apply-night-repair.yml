name: Apply validated night-patrol repair
on:
  push:
    branches: [repair/factory-qa-night-patrol-20261012]
    paths: [.github/workflows/apply-night-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply reviewed patch exactly once
        # Retry: normalized the last line of the transported patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/night-repair.patch
          git apply --index tools/night-repair.patch
          git rm tools/night-repair.patch .github/workflows/apply-night-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: stabilize city, camera and pursuit; make vehicle pickup a real interaction'
          git push origin HEAD:repair/factory-qa-night-patrol-20261012
